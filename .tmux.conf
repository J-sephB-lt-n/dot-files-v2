set -g pane-border-status top
set -g mouse on

# Make the bottom bar transparent (not solid colour)
set -g status-style 'bg=default,fg=default'

# Tabs / windows
set -g window-status-format '#[bg=colour236,fg=colour250] #I:#W #[default] '
set -g window-status-current-format '#[bg=colour33,fg=colour231,bold] #I:#W #[default] '

# Right-hand status block
set -g status-right '#[bg=colour236,fg=colour250] %H:%M #[default]'
